name: Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Python syntax and style
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install flake8
          .venv/bin/flake8 inventory_service/main.py order_service/main.py --max-line-length=120
          .venv/bin/python -m py_compile inventory_service/main.py order_service/main.py
      - name: Verify project structure
        run: |
          test -f docker-compose.yml
          test -f inventory_service/Dockerfile
          test -f order_service/Dockerfile
          test -f postman/collection.json
