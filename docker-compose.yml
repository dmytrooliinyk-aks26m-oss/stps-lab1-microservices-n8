services:
  inventory-service:
    build: ./inventory_service
    container_name: inventory-service-n8
    ports:
      - "8008:8008"
    networks:
      - microservices-net

  order-service:
    build: ./order_service
    container_name: order-service-n8
    ports:
      - "9008:9008"
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:8008
    depends_on:
      - inventory-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
